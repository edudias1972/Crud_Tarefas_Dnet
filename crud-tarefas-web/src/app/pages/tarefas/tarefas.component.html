<nav class="navbar">
  <div class="logo">📦 Sistema Tarefas</div>

  <div class="user-area">
    <span class="user-name">👤 {{ usuario }}</span>
    <span class="role">🛡 {{ role }}</span>
    <button class="btn-sair" (click)="logout()">Sair</button>
  </div>
</nav>

<mat-card class="container">

  <h2>📋 Minhas Tarefas</h2>

  <!-- FILTRO -->
  <div class="filtro">
    <input type="date" [(ngModel)]="filtroData" />
    <button mat-button (click)="filtrarPorData()">Filtrar</button>
  </div>

  <hr />

  <!-- FORM -->
  <form class="form-tarefa"
        (ngSubmit)="editando ? salvarEdicao() : adicionarTarefa()">

    <input
      placeholder="Título"
      [(ngModel)]="tarefaForm.titulo"
      name="titulo"
    />

    <input
      placeholder="Descrição"
      [(ngModel)]="tarefaForm.descricao"
      name="descricao"
    />

    <input
      type="datetime-local"
      [(ngModel)]="tarefaForm.dataHora"
      name="dataHora"
    />

    <!-- BOTÃO PRINCIPAL -->
    <button mat-raised-button class="btn-adicionar">
      {{ editando ? 'Salvar' : 'Adicionar' }}
    </button>

    <!-- CANCELAR -->
    <button
      *ngIf="editando"
      type="button"
      class="btn-cancelar"
      (click)="cancelarEdicao()">
      Cancelar
    </button>

  </form>

  <hr />

  <h2>📅 Tarefas Agendadas</h2>

  <div class="kanban">

    <!-- PENDENTES -->
    <div class="coluna">
      <h3>⏳ Pendentes</h3>

      <div class="tarefa-card" *ngFor="let t of tarefasPendentes()">

        <h4>{{ t.titulo }}</h4>
        <p>{{ t.descricao }}</p>

        <div class="acoes">
          <button class="btn-concluir" (click)="concluirTarefa(t)">
            ✔ Concluir
          </button>

          <button class="btn-editar" (click)="editarTarefa(t)">
            ✏ Editar
          </button>

          <button class="btn-excluir" (click)="deletarTarefa(t.id)">
            🗑 Excluir
          </button>
        </div>

      </div>
    </div>

    <!-- CONCLUÍDAS -->
    <div class="coluna">
      <h3>✅ Concluídas</h3>

      <div class="tarefa-card concluida"
           *ngFor="let t of tarefasConcluidas()">

        <h4>{{ t.titulo }}</h4>
        <p>{{ t.descricao }}</p>

      </div>
    </div>

  </div>

</mat-card>
